services:
  expense-tracker:
    build: .
    image: expense-tracker
    container_name: expense-tracker
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # REQUIRED: shared code needed to create an account (share only with people you want in).
      SIGNUP_CODE: ${SIGNUP_CODE:?set SIGNUP_CODE in .env}
    volumes:
      - expense-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  expense-data:
